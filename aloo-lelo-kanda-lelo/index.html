<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aloo Lelo Kanda Lelo — a free 3D Bangladeshi bazar game. Walk with a head basket, bargain with buyers and grow to a super market.">
<meta property="og:title" content="Aloo Lelo Kanda Lelo">
<meta property="og:description" content="পুরা বাংলাদেশ বাজার — ঝুড়ি মাথায় শুরু, সুপার মার্কেটে শেষ। ফ্রিতে খেলুন।">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BA%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Aloo Lelo Kanda Lelo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-screen 3D Dhaka bazar street behind the login; in-game a header + tabs, and while selling the 3D street sits on top with the HUD, order cards below */
:root{
  --bg:#eef2e4; --surface:#fbfcf6; --surface-2:#e3e9d4; --ink:#1d2618; --muted:#5b6852; --line:#cdd6bd;
  --leaf:#2f7a35; --leaf-ink:#ffffff; --pink:#c8235f; --marigold:#e9a100; --sky:#1f6fae;
  --good:#2f7a35; --warn:#a66300; --bad:#b3261e; --gold:#f2c14e;
  --logo:"Lilita One","Baloo Da 2",system-ui,sans-serif;
  --display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(29,38,24,.06),0 6px 18px -10px rgba(29,38,24,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111810; --surface:#1a2318; --surface-2:#232e20; --ink:#e7eedc; --muted:#a2b096; --line:#33402e;
  --leaf:#57b45e; --leaf-ink:#0d1a0c; --pink:#ff5d98; --marigold:#ffc23a; --sky:#6db4ee;
  --good:#6cc471; --warn:#ffb648; --bad:#ff7a6e; --gold:#ffd166;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111810; --surface:#1a2318; --surface-2:#232e20; --ink:#e7eedc; --muted:#a2b096; --line:#33402e;
  --leaf:#57b45e; --leaf-ink:#0d1a0c; --pink:#ff5d98; --marigold:#ffc23a; --sky:#6db4ee;
  --good:#6cc471; --warn:#ffb648; --bad:#ff7a6e; --gold:#ffd166;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.awning{height:14px;background:repeating-linear-gradient(90deg,var(--pink) 0 28px,var(--marigold) 28px 56px,var(--leaf) 56px 84px,var(--surface) 84px 92px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 3D stage ---------- */
.stage{position:relative;overflow:hidden;background:linear-gradient(#bfe0ec,#e9e1c8 62%,#6b6d66 62%);}
.stage canvas{display:block;width:100%;height:100%}
.stage.bg{position:fixed;inset:0;z-index:0}
.stage.inline{height:clamp(300px,52vh,520px);border-radius:16px;border:1px solid var(--line);margin-top:14px}
.stage.off{display:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:64px}
.b3d{position:absolute;inset:0;pointer-events:none}
.b3{position:absolute;transform:translate(-50%,-100%);max-width:220px;background:#fffdf4;color:#1d1a12;border:2px solid #1d1a12;border-radius:14px;padding:4px 10px;font-size:13.5px;line-height:1.35;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:normal;transition:opacity .2s}
.b3::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#1d1a12}
.b3 b{color:#b3123f}
.b3.me{background:#ffd23f;border-color:#3a1a00}
.b3.hide{opacity:0}
.hud{position:absolute;inset:10px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hud>*{pointer-events:auto}
.hud-card{background:rgba(16,22,18,.74);color:#f4f1e4;border-radius:12px;padding:6px 10px;font-size:12.5px;backdrop-filter:blur(6px);display:grid;gap:4px;min-width:180px}
.hud-card b{font-family:var(--display);font-size:15px}
.mini{height:8px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;background:#ffd23f;border-radius:9px;transition:width .3s}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.hud-btn{background:#ffd23f;color:#2a1600;border:2px solid #3a1a00;border-radius:12px;font-family:var(--display);font-weight:800;font-size:16px;padding:4px 14px;box-shadow:0 3px 0 #3a1a00}
.pauseov{position:absolute;inset:0;background:rgba(10,14,10,.62);display:grid;place-items:center;text-align:center;color:#fff;z-index:2}
.pauseov h3{font-family:var(--logo);font-size:44px;margin:0 0 6px;color:#ffd23f;letter-spacing:.02em}

/* ---------- login ---------- */
.login{position:relative;z-index:1;min-height:100vh;display:grid;align-items:center;color:#fff;
  padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,14,12,.15) 0%,rgba(8,14,12,.35) 45%,rgba(8,12,10,.82) 100%)}
.bunting{position:fixed;top:0;left:0;right:0;height:34px;display:flex;z-index:2;pointer-events:none}
.bunting span{flex:1;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;animation:flag 2.4s ease-in-out infinite alternate}
.bunting span:nth-child(6n+1){background:#e63946}.bunting span:nth-child(6n+2){background:#ffd23f}.bunting span:nth-child(6n+3){background:#2a9d4b}
.bunting span:nth-child(6n+4){background:#1d6fd6}.bunting span:nth-child(6n+5){background:#ff7ab6}.bunting span:nth-child(6n){background:#ff8c1a}
.bunting span:nth-child(odd){animation-delay:-1.2s}
@keyframes flag{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.login-in{max-width:1120px;margin:0 auto;width:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,420px);gap:28px;align-items:center}
@media (max-width:880px){.login-in{grid-template-columns:minmax(0,1fr)}}
.kicker{display:inline-block;background:#e63946;color:#fff;font-family:var(--display);font-weight:800;font-size:17px;padding:2px 14px;border-radius:99px;border:2px solid #3a0a0a;margin:0 0 10px;box-shadow:0 3px 0 #3a0a0a}
.logo{font-family:var(--logo);font-weight:400;font-size:clamp(54px,9.5vw,120px);line-height:.92;margin:0;color:#ffd23f;letter-spacing:.01em;
  -webkit-text-stroke:3px #3a1a00;paint-order:stroke fill;text-shadow:0 7px 0 #c2410c,0 12px 22px rgba(0,0,0,.45)}
.logo span{display:inline-block;animation:drop .9s cubic-bezier(.2,1.6,.4,1) both,wob 3.2s ease-in-out infinite}
.logo span:nth-child(1){animation-delay:.05s,1s}.logo span:nth-child(2){animation-delay:.2s,1.3s;color:#fff}
.logo span:nth-child(4){animation-delay:.35s,1.6s}.logo span:nth-child(5){animation-delay:.5s,1.9s;color:#7ee081}
@keyframes drop{from{transform:translateY(-120px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg) translateY(-4px)}}
.tagline{font-size:clamp(16px,2vw,20px);max-width:36ch;margin:16px 0 0;text-shadow:0 2px 8px rgba(0,0,0,.6);font-weight:600}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.floaters span{position:absolute;bottom:-60px;font-size:34px;animation:rise linear infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
.glass{background:rgba(14,20,16,.78);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:20px;backdrop-filter:blur(12px);box-shadow:0 20px 50px -20px rgba(0,0,0,.8);animation:rise-in .7s .3s ease-out both}
@keyframes rise-in{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.glass .seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;margin-bottom:14px}
.glass .seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:#e8e4d4}
.glass .seg button[aria-selected="true"]{background:#ffd23f;color:#2a1600}
.glass .field label{color:#d7d2bf}
.glass .field input{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff}
.glass .err{color:#ff9b8f}
.glass .note{color:#bdb8a6}
.cta-yellow{background:#ffd23f;color:#2a1600;border:3px solid #3a1a00;border-radius:16px;font-family:var(--display);font-weight:800;font-size:22px;padding:10px 18px;box-shadow:0 5px 0 #3a1a00;transition:transform .1s}
.cta-yellow:active{transform:translateY(3px);box-shadow:0 2px 0 #3a1a00}
.cta-yellow:disabled{opacity:.6}

/* ---------- app chrome ---------- */
.brand h1{font-family:var(--logo);font-weight:400;font-size:clamp(28px,4.2vw,40px);line-height:1;margin:0;color:var(--ink)}
.brand h1 em{font-style:normal;color:var(--pink)}
.brand small{display:block;color:var(--muted);font-size:13px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 12px;display:flex;flex-direction:column;min-width:76px}
.stat small{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:18px;line-height:1.25}
.stat.inv b{color:var(--sky)} .stat.prof b{color:var(--leaf)}
nav.tabs{display:flex;gap:6px;margin:14px 0 0;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;font-family:var(--display);font-size:17px;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pink)}
nav.tabs button:disabled{opacity:.4;cursor:not-allowed}
.banner{margin:14px 0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--marigold)}
.banner h2{margin:0;font-family:var(--display);font-size:20px;line-height:1.25}
.banner p{margin:0;color:var(--muted);flex:1 1 260px}
.banner.ev-hartal,.banner.ev-flood,.banner.ev-raid{border-left-color:var(--bad)}
.banner.ev-eid,.banner.ev-payday,.banner.ev-bumper{border-left-color:var(--leaf)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:0 9px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.cb{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:99px;white-space:nowrap}
.cb.best{background:var(--gold);color:#3a2800}.cb.good{background:var(--leaf);color:var(--leaf-ink)}.cb.low{background:var(--surface-2);color:var(--warn);border:1px solid var(--line)}
.cb.old{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-family:var(--display);font-size:20px;margin:0 0 2px;line-height:1.25}
.panel .sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.side{display:flex;flex-direction:column;gap:16px}
.cap{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .2s}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.veg{display:flex;align-items:center;gap:10px;min-width:118px}
.veg .e{font-size:26px;line-height:1}
.veg b{display:block;line-height:1.2}
.veg small{color:var(--muted);font-size:12px}
tr.locked{opacity:.45}
.cc{min-width:118px}
.cc .p{font-weight:700;display:block}
.cc .buy{display:flex;gap:4px;margin-top:3px}
.trend{font-size:12px;font-weight:600}
.trend.t-up{color:var(--bad)} .trend.t-down{color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--leaf)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:1px 8px;font-size:13px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.gold{background:var(--gold);color:#3a2800;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.big{font-family:var(--display);font-size:20px;padding:9px 26px;border-radius:12px}
.cta{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.form{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--bad);font-size:13.5px;margin:0;min-height:1.2em}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.basket{display:grid;gap:6px}
.bk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.bk .e{font-size:20px}

/* ---------- selling ---------- */
.sell-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:14px}
@media (max-width:860px){.sell-grid{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:2px 10px 2px 6px;font-size:13px}
.chip .e{font-size:18px}
.custs{display:grid;gap:10px}
.custs.paused{opacity:.45;pointer-events:none}
.cust{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface);animation:slide .25s ease-out}
.cust.final{border-color:var(--marigold)} .cust.vip{border-color:var(--sky)} .cust.own{border-color:var(--pink)}
@keyframes slide{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:10px}
.who .av{font-size:30px;line-height:1}
.who b{font-size:15.5px}
.tmrbox{margin-left:auto;display:grid;gap:3px;justify-items:end;min-width:90px}
.tmr{font-family:var(--display);font-weight:800;font-size:20px}
.tmr.low{color:var(--bad)}
.pat{height:5px;width:90px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--sky)}
.say{margin:0;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--surface-2);justify-self:start;max-width:100%}
.say.seller{justify-self:end;background:var(--gold);color:#3a2800}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lines li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px}
.lines li .e{font-size:20px}
.lines small{color:var(--muted)}
.totals{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13.5px;color:var(--muted);align-items:baseline}
.totals b{color:var(--ink)} .totals .big{font-family:var(--display);font-size:22px}
.hot{color:var(--leaf)!important} .cold{color:var(--bad)!important}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.askbox{display:flex;gap:4px}
.askbox input{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.empty-q{color:var(--muted);display:grid;place-items:center;min-height:110px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;padding:12px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.log li{padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.log li.g{border-left:3px solid var(--good)} .log li.b{border-left:3px solid var(--bad)} .log li.w{border-left:3px solid var(--marigold)}
.today{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.today div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.today small{display:block;font-size:12px;color:var(--muted)}
.today b{font-family:var(--display);font-size:20px}

/* ---------- wallet / profile / summary ---------- */
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.wallets{grid-template-columns:1fr}}
.wallet{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2)}
.wallet small{color:var(--muted);font-size:13px}
.wallet b{display:block;font-family:var(--display);font-size:30px;line-height:1.2}
.wallet.inv b{color:var(--sky)} .wallet.prof b{color:var(--leaf)}
.xfer{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:14px}
.xfer .field{flex:1 1 140px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 0 0;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11.5px;color:var(--muted);gap:2px}
.chart .col i{display:block;width:100%;max-width:38px;border-radius:5px 5px 0 0;background:var(--leaf)}
.chart .col i.neg{background:var(--bad)}
.chart-x{display:flex;gap:8px}.chart-x span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.ledger{width:100%}
.ledger td{padding:6px 4px}
.ledger tr.tot td{border-top:2px solid var(--ink);font-weight:700;font-size:17px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.prof-card{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-family:var(--display);font-size:30px;font-weight:800;flex:none}
.prof-card h3{margin:0}
.title-pill{display:inline-block;background:var(--marigold);color:#2a1d00;font-weight:700;border-radius:99px;padding:0 12px;font-size:13.5px}
.ladder{display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px;border-radius:12px;border:1.5px solid var(--line)}
.step .e{font-size:32px;grid-row:span 2}
.step b{font-family:var(--display);font-size:17px}

let cloud=null, uid=null, writeChain=Promise.resolve(), cloudT=null;
const cloudReady=(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;

const docFor=email=>cloud.collection('data/users/'+uid).doc(email.toLowerCase());
async function cloudGet(email){
  await Promise.race([cloudReady,sleep(10000)]);
  if(!cloud) return null;
  try{
    const snap=await Promise.race([docFor(email).get(),sleep(10000).then(()=>null)]);
    if(snap&&snap.exists){const d=snap.data();return d&&typeof d.state==='string'?JSON.parse(d.state):null}
  }catch(e){}
  return null;
}
function cloudSave(){
  if(!cloud||!S||!S.acct) return;
  clearTimeout(cloudT);
  const email=S.acct.email;
  cloudT=setTimeout(()=>{
    const body={state:JSON.stringify(S),savedAt:S.savedAt};
    writeChain=writeChain.then(()=>docFor(email).set(body)).catch(()=>{});

}

async function hashPin(email,pin){
  const data=new TextEncoder().encode('alkl:'+email.toLowerCase()+':'+pin);
  try{const buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}
}

function migrate(){
  if(S.v>=3) return;
  const ns={};
  for(const [id,s] of Object.entries(S.stock||{})){
    if(!s||!(s.kg>0)) continue;
    const v=VEG.find(x=>x.id===id), cu=S.custom&&S.custom[id];
    if(v) ns[id+'|good|n']={kg:s.kg,cost:(S.whole&&S.whole[id])||v.base};
    else if(cu){cu.cond='good';ns[id+'|good|n']={kg:s.kg,cost:cu.buy}}
  }
  S.stock=ns; S.custom=S.custom||{}; S.counts=S.counts||blankCounts(); S.stats.bonus=S.stats.bonus||0; S.closing=null;
  if(S.phase==='summary') S.phase='market';
  S.today=null; S.v=3;
}
function rollEvent(){
  if(S.day===1) return 'normal';
  let t=Math.random()*EVENTS.reduce((a,e)=>a+e.w,0);
  for(const e of EVENTS){t-=e.w;if(t<=0)return e.id}
  return 'normal';
}
function newToday(){return {rev:0,cost:0,kg:0,xp:0,customAdded:0,counts:blankCounts(),rep:0}}
function startDay(){
  S.event=rollEvent();
  S.prev={...S.whole};
  const sid=season().id, e=ev();
  for(const v of VEG) S.whole[v.id]=Math.max(6,Math.round(v.base*((v.s&&v.s[sid])||1)*e.whole*rand(.86,1.14)));
  S.today=newToday(); S.closing=null;
  S.phase='market';
  save();
}

    World.target=World.mode==='attract'?2.4:(World.level>=2?0:(waiting?0:(World.level===1?2.6:1.5)));
    World.speed+=(World.target-World.speed)*Math.min(1,dt*2.5);
    const ws=World.speed;
    for(const c of chunks){c.position.z+=ws*dt;if(c.position.z>CH)c.position.z-=SPAN}
    for(const p of peds){p.g.position.z+=(ws-p.dir*p.spd)*dt;
      if(p.g.position.z>18)p.g.position.z-=130;else if(p.g.position.z<-115)p.g.position.z+=130;animP(p,p.spd,dt)}
    for(const v of cars){v.g.position.z+=(ws+(v.lane>0?v.spd:-v.spd))*dt;
      if(v.g.position.z>22)v.g.position.z=-rand(120,150);else if(v.g.position.z<-150)v.g.position.z=rand(14,20);
      const rs=v.spd*dt/.35;v.wh.forEach(w=>w.rotation.x+=v.lane>0?rs:-rs);if(v.rider)animP(v.rider,1.2,dt)}
    if(rig){
      if(rig.kind==='walk')animP(rig.p,ws/1.5,dt);
      else{animP(rig.p,ws>.1?1:0,dt);rig.wh.forEach(w=>w.rotation.x-=ws*dt/.34)}
    }
    if(setPiece){setPiece.p.phase+=dt;setPiece.p.armR.rotation.x=Math.sin(setPiece.p.phase*2)*.25-.3;setPiece.p.armL.rotation.x=-.3}
    for(const b of [...buyers]){
      if(!b.p) continue;
      const pz=b.p.g.position;
      if(b.state==='in'){const dz=b.tz-pz.z,dx=b.tx-pz.x,d=Math.hypot(dx,dz);
        if(d<.08){b.state='stay';b.p.g.rotation.y=b.face}else{const st=Math.min(d,dt*2.4);pz.x+=dx/d*st;pz.z+=dz/d*st;b.p.g.rotation.y=Math.atan2(dx,dz);animP(b.p,1.2,dt)}}
      else if(b.state==='stay'){animP(b.p,0,dt);b.p.hold=b.wave;b.p.armR.rotation.x=b.wave?-2.6+Math.sin(camT*8)*.3:0}
      else{pz.z+=(b.dir*2.2+ws)*dt;b.p.g.rotation.y=b.dir>0?0:Math.PI;b.p.hold=false;animP(b.p,1.2,dt);b.life-=dt;
        if(b.life<=0){SC.remove(b.p.g);if(b.el)b.el.remove();buyers.splice(buyers.indexOf(b),1)}}
    }
    if(World.mode==='attract'){CAM.position.set(-.4+Math.sin(camT*.25)*1.2,3.9+Math.sin(camT*.4)*.25,8.5);CAM.lookAt(-1.4,1.8,-18)}
    else if(World.level>=2){CAM.position.set(2.8,3.2,6.6);CAM.lookAt(-5,1.6,-3.2)}
    else{const bob=Math.sin(camT*5)*.03*ws;CAM.position.set(-.6,3.3+bob,6.4);CAM.lookAt(-2.9,1.5,-5.5)}
    if(meTimer>0){meTimer-=dt;if(meTimer<=0&&meBubble)meBubble.classList.add('hide')}
  }
  function project(obj,y,el){
    const st=stage(),w=st.clientWidth,h=st.clientHeight,v=new T.Vector3();obj.getWorldPosition(v);v.y+=y;v.project(CAM);
    if(v.z>1||v.x<-1.3||v.x>1.3){el.style.visibility='hidden';return null}
    const x=clamp((v.x+1)/2*w,110,w-110);let py=clamp((1-v.y)/2*h,64,h-10);
    if(placed){for(let k=0;k<6;k++){const hit=placed.find(q=>Math.abs(q.x-x)<200&&Math.abs(q.y-py)<44);if(!hit)break;py=hit.y-46}placed.push({x,y:py})}
    el.style.visibility='visible';el.style.left=x+'px';el.style.top=Math.max(40,py)+'px';
  }
  let placed=null;
  function place(){
    placed=[];
    for(const b of buyers) if(b.el&&b.p&&b.state!=='out') project(b.p.g,2.15,b.el);
    for(const b of buyers) if(b.el&&b.p&&b.state==='out') project(b.p.g,2.15,b.el);
    placed=null;
    if(meBubble){const tgt=rig?rig.g:setPiece?setPiece.p.g:null;if(tgt)project(tgt,rig&&rig.kind==='walk'?2.6:2.2,meBubble)}
  }
  World.addBuyer=function(o){
    const el=document.createElement('div');el.className='b3';el.innerHTML=`<b>${esc(o.name)}:</b> ${esc(o.call)}`;$('#b3d').appendChild(el);
    if(!World.ok){const n=buyers.length;el.style.left=(20+(n%3)*30)+'%';el.style.top=(90+(n%2)*60)+'px';buyers.push({o,el,state:'stay',p:null});return}
    const slot=buyers.filter(b=>b.state!=='out').length;
    const p=person();p.g.scale.setScalar(rand(.95,1.04));SC.add(p.g);
    let b;
    if(World.level<2){const tx=-4.6+(slot%2)*.25,tz=-1.6-slot*1.25;p.g.position.set(tx-.2,.24,tz-7);b={tx,tz,face:-Math.PI/2+.5}}
    else{const tx=-3.3+(slot%2)*.5,tz=-.6-slot*1.3;p.g.position.set(tx+.5,0,Math.random()<.5?tz+9:tz-12);b={tx,tz,face:-Math.PI/2}}
    Object.assign(b,{o,el,p,state:'in',wave:true});
    setTimeout(()=>{b.wave=false},2500);
    buyers.push(b);
  };
  World.buyerSay=function(o,text){const b=buyers.find(x=>x.o===o);if(b&&b.el)b.el.innerHTML=`<b>${esc(o.name)}:</b> ${esc(text)}`};
  World.removeBuyer=function(o,text){
    const b=buyers.find(x=>x.o===o);if(!b)return;
    if(text&&b.el)b.el.innerHTML=`<b>${esc(o.name)}:</b> ${esc(text)}`;
    if(!b.p){setTimeout(()=>b.el&&b.el.remove(),1500);buyers.splice(buyers.indexOf(b),1);return}
    b.state='out';b.dir=Math.random()<.5?1:-1;b.life=3.2;setTimeout(()=>{if(b.el)b.el.classList.add('hide')},1600);
  };
  World.clearBuyers=function(){for(const b of buyers){if(b.p&&SC)SC.remove(b.p.g);if(b.el)b.el.remove()}buyers.length=0;if(meBubble){meBubble.remove();meBubble=null}};
  World.sellerSay=function(text){
    if(!meBubble){meBubble=document.createElement('div');meBubble.className='b3 me';$('#b3d').appendChild(meBubble)}
    meBubble.textContent='আপনি: '+text;meBubble.classList.remove('hide');meTimer=2.8;
    if(!World.ok){meBubble.style.left='50%';meBubble.style.top='calc(100% - 30px)';setTimeout(()=>meBubble&&meBubble.classList.add('hide'),2800)}
  };
})();

/* ================= SOUND (Web Audio street sounds + device voices) ================= */
const Sound=(()=>{
  let ctx=null,master=null,ambG=null,ambNodes=[],evTimer=null,cryTimer=null,mode='off';
  const prefs={on:true,voice:true};
  try{Object.assign(prefs,JSON.parse(lsGet('alkl-sound')||'{}'))}catch(e){}
  function unlock(){
    if(ctx){if(ctx.state==='suspended'&&!World.paused)ctx.resume().catch(()=>{});return}
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=prefs.on?.7:0;master.connect(ctx.destination);if(mode!=='off')startAmb(mode)}catch(e){ctx=null}
  }
  ['pointerdown','keydown'].forEach(t=>document.addEventListener(t,unlock,{capture:true,passive:true}));
  function noiseBuf(){const n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<n;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}return b}
  function tone(f,t0,dur,type='sine',vol=.3,f2){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
  }
  const SFX={
    bell(){const t=ctx.currentTime,n=Math.random()<.5?2:3;for(let k=0;k<n;k++){const s=t+k*.11;[2093,2637,3520].forEach((f,i)=>tone(f,s,.35,'sine',[.11,.06,.035][i]))}},
    horn(){const t=ctx.currentTime,hi=Math.random()<.5,n=Math.random()<.5?2:1;
      for(let k=0;k<n;k++){const s=t+k*.28,lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.connect(master);
        [hi?620:360,hi?780:450].forEach(f=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=f;
          g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.045,s+.02);g.gain.setValueAtTime(.045,s+.18);g.gain.linearRampToValueAtTime(0,s+.22);o.connect(g);g.connect(lp);o.start(s);o.stop(s+.25)})}},
    coin(){const t=ctx.currentTime;tone(1318,t,.12,'triangle',.25);tone(1976,t+.08,.35,'triangle',.22)},
    call(){tone(700,ctx.currentTime,.18,'sine',.15,1150)},
    pop(){tone(620,ctx.currentTime,.07,'sine',.12,900)},
    angry(){tone(220,ctx.currentTime,.35,'sawtooth',.08,110)},
    reject(){const t=ctx.currentTime;tone(440,t,.12,'square',.05);tone(330,t+.12,.18,'square',.05)},
    tick(){tone(1200,ctx.currentTime,.04,'square',.04)},
    levelup(){const t=ctx.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.12,.4,'triangle',.2))},
    bonus(){const t=ctx.currentTime;[784,988,1175,1568,1175,1568].forEach((f,i)=>tone(f,t+i*.09,.3,'triangle',.18))},
  };
  function play(n){if(!ctx||!prefs.on||!SFX[n])return;try{SFX[n]()}catch(e){}}
  function startAmb(m){
    stopAmb();mode=m;if(!ctx||m==='off')return;
    ambG=ctx.createGain();ambG.gain.setValueAtTime(0,ctx.currentTime);ambG.gain.linearRampToValueAtTime(1,ctx.currentTime+1.5);ambG.connect(master);
    const buf=noiseBuf();
    const mk=(type,f,q,vol)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.playbackRate.value=rand(.9,1.1);const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(ambG);s.start();ambNodes.push(s);return g};
    mk('lowpass',300,.7,.35);
    const crowd=mk('bandpass',900,1.2,.12);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.35;lg.gain.value=.06;lfo.connect(lg);lg.connect(crowd.gain);lfo.start();ambNodes.push(lfo);
    const road=m!=='shop';
    const sched=()=>{evTimer=setTimeout(()=>{if(!World.paused){const r=Math.random();if(r<.55)play('bell');else if(r<(road?.9:.75))play('horn')}sched()},rand(2500,road?7000:11000))};sched();
  }
  function stopAmb(){clearTimeout(evTimer);for(const n of ambNodes){try{n.stop()}catch(e){}}ambNodes=[];if(ambG){try{ambG.disconnect()}catch(e){}ambG=null}mode='off'}
  let voices=[];const loadV=()=>{try{voices=speechSynthesis.getVoices()||[]}catch(e){}};
  if(window.speechSynthesis){loadV();try{speechSynthesis.addEventListener('voiceschanged',loadV)}catch(e){}}
  const voiceFor=l=>voices.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(l));
  function say(text,lang='bn',pitch=1){
    if(!prefs.on||!prefs.voice||!window.speechSynthesis||World.paused)return;
    const v=voiceFor(lang);if(!v)return;
    try{if(speechSynthesis.pending)return;
      const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.pitch=pitch;u.rate=lang==='hi'?.95:1.05;u.volume=.9;speechSynthesis.speak(u)}catch(e){}
  }
  function hawker(on){clearTimeout(cryTimer);if(!on)return;
    const go=()=>{cryTimer=setTimeout(()=>{if(World.mode!=='off'&&!World.paused&&World.level<2&&!(sell&&sell.custs.length)){say('आलू ले लो, कांदा ले लो!','hi',.8);if(!voiceFor('hi'))play('call')}go()},rand(9000,15000))};go()}
  function drawBtns(){document.querySelectorAll('.sndbox').forEach(b=>{b.innerHTML=`<button type="button" class="snd" data-act="snd" aria-pressed="${prefs.on}">${prefs.on?'🔊':'🔇'} শব্দ</button><button type="button" class="snd" data-act="voice" aria-pressed="${prefs.voice}" ${prefs.on?'':'disabled'}>${prefs.voice?'🗣️':'🤐'} কথা</button>`})}
  function set(k,v){prefs[k]=v;lsSet('alkl-sound',JSON.stringify(prefs));if(master)master.gain.value=prefs.on?.7:0;if(!prefs.on||!prefs.voice){try{speechSynthesis.cancel()}catch(e){}}drawBtns()}
  function suspend(p){if(p){try{speechSynthesis.cancel()}catch(e){}if(ctx)ctx.suspend().catch(()=>{})}else if(ctx)ctx.resume().catch(()=>{})}
  return {play,say,hawker,set,prefs,suspend,drawBtns,
    ambient(m){mode=m;if(ctx)startAmb(m)},
    stop(){stopAmb();clearTimeout(cryTimer);try{speechSynthesis.cancel()}catch(e){}},
    female:n=>/আপা|ভাবি|খালা|নানি/.test(n)};
})();

async function onAuth(e){
  e.preventDefault();
  const err=$('#a-err'), email=$('#a-email').value.trim().toLowerCase(), pin=$('#a-pin').value.trim();
  if(Date.now()<lockUntil){err.textContent=`অনেকবার ভুল পিন। ${bn(Math.ceil((lockUntil-Date.now())/1000))} সেকেন্ড পরে চেষ্টা করুন।`;return}
  if(!GMAIL.test(email)){err.textContent='সঠিক জিমেইল ঠিকানা দিন, যেমন: name@gmail.com';return}
  if(!PIN.test(pin)){err.textContent='পিন হবে ৪টা সংখ্যা।';return}
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; err.textContent='';
  if(authMode==='signup'){
    const name=$('#a-name').value.trim(), store=$('#a-store').value.trim();
    if(name.length<2){err.textContent='আপনার নাম লিখুন।';btn.disabled=false;return}
    if(store.length<2){err.textContent='দোকানের নাম লিখুন।';btn.disabled=false;return}
    btn.textContent='দেখা হচ্ছে…';
    const exists=loadLocal(email)||await cloudGet(email);
    if(exists){authMode='login';showLogin('এই জিমেইলে আগেই অ্যাকাউন্ট আছে। লগইন করুন।');$('#a-email').value=email;return}
    S=newState({name,store,email,created:Date.now(),pinHash:await hashPin(email,pin)});
    tab='bazar'; startDay(); enterApp(); return;
  }
  btn.textContent='রেকর্ড খোঁজা হচ্ছে…';
  const local=loadLocal(email), remote=await cloudGet(email);
  const st=(local&&remote)?((remote.savedAt||0)>(local.savedAt||0)?remote:local):(local||remote);
  if(!st){showLogin('এই জিমেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি। নতুন অ্যাকাউন্ট খুলুন।');return}
  const h=await hashPin(email,pin);
  if(st.acct.pinHash&&st.acct.pinHash!==h){
    pinFails++; if(pinFails>=5){lockUntil=Date.now()+30000;pinFails=0}
    btn.disabled=false;btn.textContent='লগইন করে বাজারে ফেরেন';err.textContent='পিন মিলছে না। আবার চেষ্টা করুন।';return;
  }
  pinFails=0;
  const newPin=!st.acct.pinHash; if(newPin) st.acct.pinHash=h;
  S=st; resume(); if(newPin) note('আপনার অ্যাকাউন্টে নতুন পিন সেট হলো।');
}
function note(t){const v=$('#view');if(v)v.insertAdjacentHTML('afterbegin',`<p class="banner" role="status">${esc(t)}</p>`)}
function resume(){
  migrate();
  if(S.phase==='selling') S.phase='market';
  if(S.phase==='summary'&&!S.summary) S.phase='market';
  if(!S.whole||!Object.keys(S.whole).length) startDay();
  if(!S.today||!S.today.counts) S.today=newToday();
  tab='bazar'; save(); enterApp();
}
function enterApp(){$('#login').hidden=true;$('#login').innerHTML='';$('#app').hidden=false;render()}
function logout(){

}

const calm=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function tweenEl(el,key,val){
  const from=prevStat[key]; prevStat[key]=val;
  if(from===undefined||from===val||calm()){el.textContent=tk(val);return}
  el.textContent=tk(from); el.classList.add(val>from?'tw-up':'tw-down');
  const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/600);el.textContent=tk(from+(val-from)*k*(2-k));if(k<1)requestAnimationFrame(step);else setTimeout(()=>el.classList.remove('tw-up','tw-down'),250)};
  requestAnimationFrame(step);
}
function tweens(root,prefix){if(!root)return;root.querySelectorAll('[data-tw]').forEach(el=>{const k=el.dataset.tw;tweenEl(el,prefix+k,k==='inv'?S.invest:S.profit)})}

function flyTo(rect,emoji,key){
  if(!rect||calm()) return;
  const t=document.querySelector(`.bk[data-k="${key}"]`)||$('#basketPanel'); if(!t) return;
  const tr=t.getBoundingClientRect(), x0=rect.left+rect.width/2, y0=rect.top+rect.height/2;
  const el=document.createElement('div'); el.className='fly'; el.textContent=emoji; el.style.left=x0+'px'; el.style.top=y0+'px'; document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`translate(calc(-50% + ${tr.left+40-x0}px), calc(-50% + ${tr.top+tr.height/2-y0}px)) scale(.6)`;el.style.opacity='.3'}));
  setTimeout(()=>{el.remove();const b=document.querySelector(`.bk[data-k="${key}"]`);if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}},650);
}
function floaty(text,cls,dy=0){
  const fs=$('#fsplay'); if(!fs) return;
  const el=document.createElement('div'); el.className='floaty '+cls; el.textContent=text;
  el.style.left=rand(30,52)+'%'; el.style.top=`calc(42% + ${dy}px)`; fs.appendChild(el); setTimeout(()=>el.remove(),1600);
}

function addStock(key,q,cost){const st=S.stock[key]||{kg:0,cost};st.cost=(st.kg*st.cost+q*cost)/(st.kg+q);st.kg+=q;S.stock[key]=st}
function addCustom(e){
  e.preventDefault();
  const err=$('#c-err'), name=$('#c-name').value.trim(), type=$('#c-type').value, cond=$('#c-cond').value;
  const buy=Math.round(+$('#c-buy').value), tag=Math.round(+$('#c-tag').value), q=Math.round(+$('#c-qty').value);
  if(S.today.customAdded>=CUSTOM_PER_DAY){err.textContent='আজকের সীমা শেষ।';return}
  if(name.length<2){err.textContent='পণ্যের নাম লিখুন।';return}
  if(!(buy>=5&&buy<=1000)){err.textContent='কেনা দাম ৫ থেকে ১০০০ টাকার মধ্যে দিন।';return}
  if(!(tag>=buy&&tag<=2000)){err.textContent='দামের ট্যাগ কেনা দামের সমান বা বেশি দিন।';return}
  if(!(q>=1&&q<=CUSTOM_MAX_KG)){err.textContent=`পরিমাণ ১ থেকে ${bn(CUSTOM_MAX_KG)} কেজি দিন।`;return}
  if(stockKg()+q>lvl().cap){err.textContent='এত মাল নেওয়ার জায়গা নেই।';return}
  if(S.invest<buy*q){err.textContent=`পুঁজিতে ${tk(buy*q)} লাগবে, আছে ${tk(S.invest)}।`;return}
  const id='c'+(++S.cseq);
  S.custom[id]={name,type,cond,buy,tag};
  addStock(id+'|'+cond+'|n',q,buy);
  S.invest-=buy*q; S.today.cost+=buy*q; S.today.customAdded++;
  save(); render();
}

function openStall(){
  S.phase='selling';
  sell={spawnIn:1200,custs:[],log:[],seq:0,budget:Math.max(100,stockCost()*BUDGET_X),orderVal:0,paused:false,ended:false};
  save(); render();
  let last=performance.now();
  loop=setInterval(()=>{const now=performance.now();tick(Math.min(250,now-last));last=now},100);
}
function custRate(){const e=ev(),u=S.up;return e.cust*(u.sign?1.2:1)*(u.qr?1.15:1)*(u.delivery?1.3:1)*(0.6+S.rep/125)}
function reserved(key){return sell.custs.reduce((a,c)=>a+c.lines.filter(l=>l.key===key).reduce((s,l)=>s+l.q,0),0)}
const availKg=k=>(S.stock[k]?S.stock[k].kg:0)-reserved(k);
function spawn(){
  if(sell.orderVal>=sell.budget) return;
  if(sell.custs.length>=3+(S.level>=2?1:0)) return;
  const keys=Object.keys(S.stock).filter(k=>availKg(k)>=0.5&&info(k));
  if(!keys.length) return;
  const L=lvl(), e=ev();
  const own=keys.filter(k=>info(k).custom), std=keys.filter(k=>!info(k).custom);
  let lines=[], custom=false;
  if(own.length&&(Math.random()<.25||!std.length)){
    const k=pick(own), it=info(k), cu=S.custom[it.id], r=it.tag/cu.buy;
    if(Math.random()<(r<=1.5?1:Math.max(.12,1-(r-1.5)*.8))){
      lines=[{key:k,q:Math.min(Math.floor(availKg(k)*2)/2,pick([.5,1,1,2])),offer:it.tag,max:it.tag}];custom=true;
    }
  }
  const vip=!custom&&S.level>=2&&Math.random()<.12;
  if(!lines.length){
    if(!std.length) return;
    const n=Math.min(std.length,Math.random()<.55?1:Math.random()<.7?2:3);
    for(const k of shuffle(std).slice(0,n)){
      const it=info(k);
      let q=pick([.5,1,1,1.5,2,3])*L.mult*(S.up.delivery?1.3:1)*rand(.8,1.2)*(vip?3:1)/(n>1?1.6:1);
      q=Math.max(.5,Math.min(Math.floor(availKg(k)*2)/2,Math.round(q*2)/2));
      const max=it.base*COND[it.c].mult*rand(.95,1.25)*(S.up.scale?1.06:1)*e.will*(0.9+S.rep/500);
      lines.push({key:k,q,max,offer:Math.max(1,Math.round(max*rand(.72,.88)))});
    }
    if(Math.random()<.15) lines.forEach(l=>l.offer=Math.max(1,Math.round(l.offer*rand(.55,.75))));
  }
  const O=Math.round(lines.reduce((a,l)=>a+l.q*l.offer,0));
  const maxT=Math.round(lines.reduce((a,l)=>a+l.q*l.max,0));
  const C=Math.round(lines.reduce((a,l)=>a+l.q*S.stock[l.key].cost,0));
  const Mt=Math.round(lines.reduce((a,l)=>a+l.q*info(l.key).mc,0));
  const [name,av]=vip?pick(BIG):pick(NAMES);
  const list=lines.map(l=>`${bn(l.q,1)} কেজি ${info(l.key).name}`).join(', ');
  const say=custom?`দাম তো লেখাই আছে। ${list} দেন, ${bn(O)} টাকা।`:
    pick([`মামা, ${list} দেন। সব মিলায়ে ${bn(O)} টাকা দিমু।`,`${list} লাগবে। ${bn(O)} টাকা হইলে নিমু।`,`টাটকা তো? ${list}, ${bn(O)} টাকা দিমু।`]);
  const o={id:++sell.seq,name,av,lines,offer:O,first:O,max:Math.max(O,maxT),cost:C,mkt:Mt,round:0,asked:false,final:custom,custom,vip,
    left:ORDER_MS,wait:0,say,call:L.road?pick(ROAD_CALLS):pick(SHOP_CALLS),sellerSaid:'',lossSaid:false,skipped:false};
  sell.orderVal+=O;
  sell.custs.push(o); World.addBuyer(o); upsertCard(o); drawHud();
  Sound.play('call'); Sound.say(o.call,'bn',Sound.female(name)?1.3:.85);
}
function tick(dt){
  if(!sell||sell.paused||sell.ended) return;
  sell.spawnIn-=dt;
  if(sell.spawnIn<=0){spawn();sell.spawnIn=lvl().every/custRate()*rand(.6,1.4)}
  for(const c of [...sell.custs]){
    if(!sell) return;
    c.left-=dt; c.wait+=dt;
    if(S.up.helper&&c.wait>2500&&c.offer>=c.mkt&&!c.custom){doSell(c,c.offer,'কর্মচারী বিক্রি করল:');continue}
    if(c.left<=0){S.today.counts.miss++;addRep(-1);Sound.play('reject');leave(c,`${c.name} অপেক্ষা করতে করতে চলে গেল। সুনাম −১`,'b','থাক, অন্য জায়গা থেকে নিমু।')}
  }
  if(!sell) return;
  for(const c of sell.custs){
    const s=Math.max(0,Math.ceil(c.left/1000));
    if(s<=5&&s>0&&c.lastS!==s){c.lastS=s;Sound.play('tick')}
    const t=document.querySelector(`[data-tmr="${c.id}"]`); if(t){t.textContent=bn(s)+' সে';t.classList.toggle('low',s<=10)}
    const p=document.querySelector(`[data-pat="${c.id}"]`); if(p) p.style.width=Math.max(0,c.left/ORDER_MS*100)+'%';
  }
  checkEnd();
}
function checkEnd(){
  if(!sell||sell.ended) return;
  if(stockKg()<0.05){endSelling('soldout');return}
  const spawnable=Object.keys(S.stock).some(k=>availKg(k)>=0.5);
  if(!sell.custs.length&&(sell.orderVal>=sell.budget||!spawnable)) endSelling('gone');
}
function doSell(c,total,how){
  total=Math.round(total);
  const r=total/c.first; let sold=0, ordered=0, delta=0, allOk=true; const notes=[];
  for(const l of c.lines){
    ordered+=l.q;
    const st=S.stock[l.key]; if(!st) continue;
    const it=info(l.key), q=Math.min(l.q,st.kg); sold+=q;
    st.kg-=q; if(st.kg<0.05) delete S.stock[l.key];
    if(c.custom) continue;
    const cat=priceCat(l.offer*r,it.base), ok=CAT_OK[it.c]===cat;
    if(!ok) allOk=false;
    delta+=ok?1:-1; notes.push(`${it.name} (${COND[it.c].name}) ${CAT_NAME[cat]}ে ${ok?'+১':'−১'}`);
  }
  if(ordered>0&&sold<ordered) total=Math.round(total*sold/ordered);
  Sound.play('coin'); floaty('+'+tk(total),'g');
  if(how==='first'&&!c.custom&&allOk&&total>=c.cost){delta+=2;notes.push('প্রথম দামেই রাজি +২');World.sellerSay('মামা, আবার আইসেন!');Sound.say('মামা, আবার আইসেন!','bn',.85)}
  else World.sellerSay(c.custom?'নেন মামা, ঠিক ওজন।':'আচ্ছা নেন মামা।');
  if(total-c.first>=50){delta-=3;notes.push('প্রথম দামের চেয়ে ৳৫০+ বেশি নিলেন −৩')}
  addRep(delta);
  const xp=2+Math.floor(sold);
  S.invest+=total; S.today.rev+=total; S.today.kg+=sold; S.today.xp+=xp; S.xp+=xp; S.today.counts.acc++;
  S.stats.earned+=total; S.stats.sold+=sold;
  addLog(`${how&&how.length>8?how:'বিক্রি:'} ${c.name}-কে ${tk(total)}-এ · +${bn(xp)} অভিজ্ঞতা${notes.length?` · সুনাম ${delta>=0?'+':'−'}${bn(Math.abs(delta))} (${notes.join('; ')})`:''}`,delta<0?'w':'g');
  removeOrder(c,how==='first'&&delta>0?'ধন্যবাদ মামা, আবার আসমু!':'আচ্ছা, দেন।');
  drawChips(); drawToday(); renderStats(); drawHud(); checkEnd();
}

function askPrice(c,A,loss){
  A=Math.round(A);
  const err=document.getElementById('aerr-'+c.id);
  if(!(A>c.offer)){if(err)err.textContent='ক্রেতার দামের চেয়ে বেশি লিখুন।';return}
  c.asked=true;
  c.sellerSaid=loss?`লাভ থাকবো না মামা! ${bn(A)} টাকা দেন।`:`${bn(A)} টাকা দেন মামা।`;
  World.sellerSay(c.sellerSaid); Sound.say(c.sellerSaid,'bn',.85);
  const bp=Sound.female(c.name)?1.3:1;

  if(A<=c.max){c.say='আচ্ছা ঠিক আছে, দেন।';World.buyerSay(c,c.say);doSell(c,A,'deal');return}
  if(c.final||(A>c.max*1.6&&Math.random()<.4)){
    S.today.counts.miss++;addRep(-1);Sound.play('angry');Sound.say('এত দাম কেন? ডাকাত নাকি?','bn',bp);
    leave(c,`“এত দাম কেন? ডাকাত নাকি?” ${c.name} রাগ করে চলে গেল। সুনাম −১`,'b','এত দাম কেন? ডাকাত নাকি?');return;
  }
  const hi=Math.min(A,c.max), nO=Math.max(c.offer+1,Math.round(c.offer+(hi-c.offer)*rand(.3,.75)));
  c.offer=nO; c.round++; if(c.round>=2) c.final=true;
  c.say=c.final?`দিলে দাও, নাইলে যাও! ${bn(nO)} টাকা, এটাই শেষ দাম।`:pick([`আরে না মামা, ${bn(nO)} টাকা দিমু।`,`একটু কমান। ${bn(nO)} টাকা হইলে নিমু।`,`এত না, ${bn(nO)} টাকা দেই?`]);

  upsertCard(c);
}

function finalizeDay(choice){
  const L=lvl(), e=ev(), cl=S.closing||{reason:'gone',bonus:0};
  let mohajon=0, kept=0, keptKg=0;
  const ns={};
  for(const [k,st] of Object.entries(S.stock)){
    const {id,a}=parseKey(k);
    if(choice!=='keep'||a==='o'){mohajon+=st.kg*st.cost*.5}
    else{const nk=id+'|low|o',cost=st.cost*.75,t=ns[nk]||{kg:0,cost};t.cost=(t.kg*t.cost+st.kg*cost)/(t.kg+st.kg);t.kg+=st.kg;ns[nk]=t;kept++;keptKg+=st.kg}
  }
  S.stock=ns; mohajon=Math.round(mohajon);
  for(const id of Object.keys(S.custom)) if(!Object.keys(S.stock).some(k=>k.startsWith(id+'|'))) delete S.custom[id];
  const repLoss=Math.min(4,kept); if(repLoss) addRep(-repLoss);
  const rent=L.rent, wage=S.up.helper?100:0, fine=(e.id==='raid'&&!S.up.scale)?FINE:0;
  S.invest+=mohajon-rent-wage-fine;
  if(mohajon) addLedger('বাকি মাল মহাজনের কাছে বেচা',mohajon,'inv');
  const net=S.today.rev+mohajon-S.today.cost-rent-wage-fine;
  let moved=0,covered=0;
  if(net>0){moved=Math.min(net,Math.max(0,S.invest));S.invest-=moved;S.profit+=moved;addLedger(`দিন ${bn(S.day)}-এর নেট লাভ জমা`,moved,'prof')}
  else if(net<0) addLedger(`দিন ${bn(S.day)}-এর লোকসান (পুঁজি থেকে)`,net,'inv');
  if(S.invest<0&&S.profit>0){covered=Math.min(S.profit,-S.invest);S.profit-=covered;S.invest+=covered;addLedger('পুঁজির ঘাটতি নেট লাভ থেকে পূরণ',-covered,'prof')}
  for(const k of Object.keys(S.counts)) S.counts[k]+=S.today.counts[k];
  S.hist.push({d:S.day,net}); S.hist=S.hist.slice(-10);
  S.stats.best=Math.max(S.stats.best,net);
  S.summary={...S.today,counts:{...S.today.counts},rent,wage,fine,net,moved,covered,mohajon,kept,keptKg,repLoss,bonus:cl.bonus,reason:cl.reason,day:S.day,ev:e.name};
  S.closing=null; S.phase='summary'; save(); render();
}

    <div class="kv" style="grid-template-columns:repeat(4,minmax(0,1fr));margin:12px 0"><div><small>নেয়া অর্ডার</small><b>${bn(c.acc)}</b></div><div><small>বাতিল</small><b>${bn(c.rej)}</b></div><div><small>পরে দেখা</small><b>${bn(c.skip)}</b></div><div><small>হাতছাড়া</small><b>${bn(c.miss)}</b></div></div>
    <table class="ledger"><tbody>
      ${row(`বিক্রি (${kg(s.kg)})`,tk(s.rev),'pos')}
      ${s.mohajon?row('মহাজনের কাছে বাকি মাল',tk(s.mohajon),'pos'):''}
      ${row('আজ কেনা মাল',tk(-s.cost),'neg')}
      ${s.rent?row('ভাড়া ও লাইন খরচ',tk(-s.rent),'neg'):''}
      ${s.wage?row('কর্মচারীর বেতন',tk(-s.wage),'neg'):''}
      ${s.fine?row('জরিমানা (ডিজিটাল পাল্লা নেই)',tk(-s.fine),'neg'):''}
      <tr class="tot"><td>আজকের নেট</td><td class="r ${s.net>=0?'pos':'neg'}">${tk(s.net)}</td></tr>
    </tbody></table>
    <p style="margin:0 0 6px">${s.moved?`<b class="pos">${tk(s.moved)}</b> “নেট লাভের হিসাব”-এ জমা হলো। `:''}${s.covered?`পুঁজির ঘাটতি মেটাতে নেট লাভ থেকে ${tk(s.covered)} গেল। `:''}আজ +${bn(s.xp)} অভিজ্ঞতা, সুনাম ${s.rep>=0?'+':'−'}${bn(Math.abs(Math.round(s.rep*10)/10),1)}।</p>
    ${s.kept?`<p style="margin:0 0 6px">${kg(s.keptKg)} মাল কাল “তেমন ভালো না” হিসেবে ঝুড়িতে থাকবে, দাম ২৫% কম। না বেচতে পারায় সুনাম −${bn(s.repLoss)}।</p>`:''}
    ${ready?`<div class="win"><h3>লেভেল আপ করা যাবে!</h3><p style="margin:4px 0 0">অভিজ্ঞতা আর নেট লাভ দুটোই হয়েছে। “প্রোফাইল” ট্যাবে গিয়ে ${next.e} ${next.name} নিন।</p></div>`:''}
    <div class="cta"><button class="btn big primary" data-act="next">পরের দিন ভোর →</button></div>
  </section>`;
}

/* ================= NET PROFIT TAB ================= */

  $('#view').innerHTML=`<div class="grid" style="margin-top:14px">
   <section class="panel">
    <h3>নেট লাভের হিসাব</h3><p class="sub">দিনশেষে নেট লাভ এখানে আলাদা জমা হয়, মহাজনের বোনাসও এখানে আসে। এই টাকায় লেভেল আপ আর দোকানের জিনিস কেনা হয়। চাইলে পুঁজিতে পাঠিয়ে বেশি মাল কিনতে পারেন।</p>
    <div class="wallets">
      <div class="wallet prof"><small>নেট লাভ তহবিল</small><b>${tk(S.profit)}</b><small>লেভেল আপ ও আপগ্রেডে খরচ হয়</small></div>
      <div class="wallet inv"><small>পুঁজি (মাল কেনার টাকা)</small><b>${tk(S.invest)}</b><small>পাইকারি কেনাকাটায় খরচ হয়</small></div>
    </div>
    <form id="xForm" class="xfer" novalidate>
      <div class="field"><label for="x-amt">টাকার পরিমাণ</label><input id="x-amt" type="number" min="1" inputmode="numeric" placeholder="৫০০"></div>
      <button class="btn primary" type="submit" data-dir="toInv">নেট লাভ → পুঁজিতে পাঠান</button>
      <button class="btn" type="submit" data-dir="toProf">পুঁজি → নেট লাভে তুলুন</button>
    </form>
    <div class="quick">${[100,500,1000].map(n=>`<button class="btn ghost" type="button" data-act="amt" data-n="${n}">${tk(n)}</button>`).join('')}<button class="btn ghost" type="button" data-act="amt" data-n="all">সব নেট লাভ</button></div>
    <p class="err" id="x-err"></p>
    <h3 style="margin-top:12px">শেষ ${bn(h.length)} দিনের নেট</h3>
    ${h.length?`<div class="chart">${h.map(x=>`<div class="col"><span>${tk(x.net)}</span><i class="${x.net<0?'neg':''}" style="height:${Math.max(3,Math.abs(x.net)/mx*100)}px"></i></div>`).join('')}</div>
      <div class="chart-x">${h.map(x=>`<span>দিন ${bn(x.d)}</span>`).join('')}</div>`:'<p class="muted">প্রথম দিন শেষ হলে এখানে হিসাব দেখা যাবে।</p>'}
   </section>
   <section class="panel"><h3>লেনদেন</h3><p class="sub">সাম্প্রতিক জমা-খরচ</p>
    <table class="ledger"><tbody>${S.ledger.slice(0,14).map(l=>`<tr><td><small class="muted">দিন ${bn(l.d)}</small><br>${l.t}</td><td class="r ${l.a>=0?'pos':'neg'}">${l.a>=0?'+':''}${tk(l.a)}<br><small class="muted">${l.w==='prof'?'নেট লাভ':'পুঁজি'}</small></td></tr>`).join('')}</tbody></table>
   </section></div>`;
  $('#xForm').addEventListener('submit',e=>{
    e.preventDefault();
    const dir=(e.submitter&&e.submitter.dataset.dir)||'toInv', a=Math.round(+$('#x-amt').value), err=$('#x-err');
    if(!(a>0)){err.textContent='টাকার পরিমাণ লিখুন।';return}
    if(dir==='toInv'){if(a>S.profit){err.textContent=`নেট লাভ তহবিলে আছে ${tk(S.profit)}।`;return}
      S.profit-=a;S.invest+=a;addLedger('নেট লাভ থেকে পুঁজিতে পাঠানো',a,'inv')}
    else{if(a>S.invest){err.textContent=`পুঁজিতে আছে ${tk(S.invest)}।`;return}
      S.invest-=a;S.profit+=a;addLedger('পুঁজি থেকে নেট লাভে তোলা',a,'prof')}
    save(); render();
  });
}

/* ================= PROFILE TAB ================= */
function renderProfile(){
  const L=lvl(), next=LEVELS[S.level+1], a=S.acct, ct=S.counts;
  const xpPct=next?Math.min(100,S.xp/next.xp*100):100;
  const ladder=LEVELS.map((l,i)=>{
    const can=i===S.level+1&&S.xp>=l.xp&&S.profit>=l.cost;
    return `<div class="step ${i<S.level?'done':i===S.level?'cur':''}"><span class="e">${l.e}</span><b>${l.name}</b>
      ${i<S.level?'<span class="st pos">✓ পার হয়েছে</span>':i===S.level?'<span class="st" style="color:var(--pink)">এখন এখানে</span>':i===S.level+1?`<button class="btn pink st" data-act="level" ${can?'':'disabled'}>${tk(l.cost)}-এ আপগ্রেড</button>`:'<span class="st muted">তালাবদ্ধ</span>'}
      <small>${l.title} · ${i?`দরকার ${bn(l.xp)} অভিজ্ঞতা ও নেট লাভ থেকে ${tk(l.cost)}`:'শুরু'} · ${bn(l.cap)} কেজি · সব বেচলে বোনাস ${tk(50*Math.pow(2,i))}</small></div>`}).join('');
  const ups=UPS.map(u=>{const own=S.up[u.id],lock=u.min>S.level;
    return `<div class="up ${own?'own':''}"><b>${u.name}</b>
      ${own?'<span class="owned">কেনা হয়েছে</span>':lock?`<span class="tag">${LEVELS[u.min].name} লাগবে</span>`:`<button class="btn" data-act="up" data-id="${u.id}" ${S.profit<u.cost?'disabled':''}>${tk(u.cost)}</button>`}
      <p>${u.desc}</p></div>`}).join('');
  $('#view').innerHTML=`<div class="grid" style="margin-top:14px">
   <div class="side">
    <section class="panel">
      <div class="prof-card"><div class="avatar" aria-hidden="true">${esc(a.name.trim().charAt(0))}</div>
        <div style="min-width:0"><h3>${esc(a.name)}</h3><div class="muted">${esc(a.store)} · ${esc(a.email)}</div><span class="title-pill">${L.e} ${L.title}</span></div></div>
      <div style="margin-top:14px">
        <div class="cap" style="margin:0"><span>অভিজ্ঞতা</span><div class="bar"><i style="width:${xpPct}%;background:var(--marigold)"></i></div><span>${bn(S.xp)}${next?' / '+bn(next.xp):''}</span></div>
        <p class="note">${next?`পরের লেভেল (${next.name}) পেতে ${S.xp>=next.xp?'অভিজ্ঞতা পূর্ণ হয়েছে':bn(next.xp-S.xp)+' অভিজ্ঞতা আরও লাগবে'}, আর নেট লাভ তহবিলে ${S.profit>=next.cost?'যথেষ্ট টাকা আছে':tk(next.cost-S.profit)+' আরও লাগবে'}।`:'সর্বোচ্চ লেভেলে পৌঁছে গেছেন!'}</p>
      </div>
      ${S.won?'<div class="win"><h3>আপনি এখন সুপার মার্কেটের মালিক!</h3><p style="margin:4px 0 0">ঝুড়ি মাথায় শুরু করে এতদূর। খেলা চালিয়ে যান।</p></div>':''}
    </section>
    <section class="panel"><h3>পরিসংখ্যান</h3>
      <div class="kv" style="margin-top:8px">
        <div><small>খেলার দিন</small><b>${bn(S.day)}</b></div><div><small>মোট বিক্রি</small><b>${tk(S.stats.earned)}</b></div>
        <div><small>নেয়া অর্ডার</small><b>${bn(ct.acc)}</b></div><div><small>বাতিল অর্ডার</small><b>${bn(ct.rej)}</b></div>
        <div><small>হাতছাড়া অর্ডার</small><b>${bn(ct.miss)}</b></div><div><small>মহাজনের বোনাস</small><b>${tk(S.stats.bonus)}</b></div>
        <div><small>বিক্রি করা মাল</small><b>${kg(S.stats.sold)}</b></div><div><small>সেরা দিনের নেট</small><b>${tk(S.stats.best)}</b></div>
      </div>
      <div class="cta"><button class="btn ghost" data-act="logout">লগআউট</button></div>
    </section>
   </div>
   <div class="side">
    <section class="panel"><h3>ব্যবসার সিঁড়ি</h3><p class="sub">টাকা যায় নেট লাভ তহবিল থেকে। প্রতি ধাপে খরচ দ্বিগুণ।</p><div class="ladder">${ladder}</div></section>
    <section class="panel"><h3>দোকানের জিনিস</h3><p class="sub">একবার কিনলে সবসময় থাকে। নেট লাভ থেকে কেনা।</p><div class="ups">${ups}</div></section>
   </div></div>`;
}

/* ================= ACTIONS + BOOT ================= */
function act(a,d){
  if(a==='snd'){Sound.set('on',!Sound.prefs.on);return}
  if(a==='voice'){Sound.set('voice',!Sound.prefs.voice);return}
  if(a==='auth'){authMode=d.m;showLogin();return}
  if(!S) return;
  if(['buy','tab','amt','finish','next'].includes(a)) Sound.play('pop');
  if(a==='tab'){if(S.phase==='selling'&&d.t!=='bazar')return;tab=d.t;render();return}
  if(a==='buy'){
    const {id,c}=parseKey(d.key), n=+d.kg, price=wp(id,c), cost=price*n;
    if(S.invest<cost||stockKg()+n>lvl().cap) return;
    const rect=lastBtn&&lastBtn.isConnected?lastBtn.getBoundingClientRect():null;
    addStock(d.key,n,price); S.invest-=cost; S.today.cost+=cost; save(); render();
    flyTo(rect,VEG.find(x=>x.id===id).e,d.key);
  }else if(a==='level'){
    const n=LEVELS[S.level+1]; if(!n||S.profit<n.cost||S.xp<n.xp||S.phase==='selling') return;
    Sound.play('levelup'); S.profit-=n.cost; S.level++; addLedger(`${n.name}-এ লেভেল আপ`,-n.cost,'prof');
    if(S.level===LEVELS.length-1) S.won=true;
    save(); render();
  }else if(a==='up'){
    const u=UPS.find(x=>x.id===d.id); if(!u||S.profit<u.cost||S.up[u.id]||S.phase==='selling') return;
    Sound.play('coin'); S.profit-=u.cost; S.up[u.id]=true; addLedger(`${u.name} কেনা`,-u.cost,'prof'); save(); render();
  }else if(a==='amt'){const el=$('#x-amt');if(el)el.value=d.n==='all'?Math.floor(S.profit):d.n}
  else if(a==='loan'){S.invest+=500;addRep(-10);addLedger('মহাজনের ধার',500,'inv');save();render()}
  else if(a==='open'){enterFs();openStall()}
  else if(a==='fs'){document.fullscreenElement?exitFs():enterFs()}
  else if(a==='close'){if(sell&&!sell.paused){S.today.counts.miss+=sell.custs.length;endSelling('gone')}}
  else if(a==='pause'){togglePause()}
  else if(a==='finish'){finalizeDay(d.c)}
  else if(a==='next'){S.day++;startDay();render()}
  else if(a==='logout'){logout()}
  else if(sell&&!sell.paused){
    const c=sell.custs.find(x=>x.id===+d.cid); if(!c) return;
    const inp=document.getElementById('ask-'+c.id), typed=inp?Math.round(+inp.value):0;
    if(a==='accept') doSell(c,c.offer,c.round===0&&!c.asked?'first':'deal');
    else if(a==='ask') askPrice(c,typed||Math.round(Math.max(c.mkt,c.offer*1.15)),false);
    else if(a==='loss') askPrice(c,Math.max(typed||0,Math.round(c.cost*1.1),c.offer+1),true);
    else if(a==='skip'){if(!c.skipped){c.skipped=true;S.today.counts.skip++}
      sell.custs=sell.custs.filter(x=>x!==c);sell.custs.push(c);const el=document.getElementById('card-'+c.id);if(el)$('#custs').appendChild(el);
      World.sellerSay('একটু দাঁড়ান মামা, আসতেছি।');Sound.play('pop');Sound.say('একটু দাঁড়ান মামা, আসতেছি।','bn',.85);drawHud()}
    else if(a==='reject'){S.today.counts.rej++;World.sellerSay('না মামা, এই দামে হবে না।');Sound.play('reject');Sound.say('না মামা, এই দামে হবে না।','bn',.85);leave(c,`${c.name}-এর অর্ডার বাতিল করলেন।`,'w','ঠিক আছে, অন্য জায়গা থেকে নিমু।')}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){lastBtn=b;act(b.dataset.act,b.dataset)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ask-')){e.preventDefault();act('ask',{cid:e.target.id.slice(4)})}});

function render(){
  if(!S){showLogin();return}
  if(S.phase!=='selling') parkStage();
  renderStats(); drawSync();
  if(S.phase==='selling'){tab='bazar';parkStage();renderSelling();return}
  $('#stage').className='stage off'; $('#hud').hidden=true; $('#pauseov').hidden=true; World.setMode('off'); Sound.stop();
  document.body.classList.remove('playing'); exitFs();
  if(tab==='profit') renderProfit();
  else if(tab==='profile') renderProfile();
  else if(S.phase==='closing') renderClosing();
  else if(S.phase==='summary') renderSummary();
  else renderMarket();
}
async function boot(data){
  try{await Promise.race([document.fonts.ready,sleep(2500)])}catch(e){}
  World.init();
  if(data&&data.S&&data.S.acct){S=data.S;resume();return}
  const last=lsGet('alkl-last'), sess=lsGet('alkl-session'), st=sess?loadLocal(sess):null;
  if(st&&st.acct){
    S=st; resume();
    cloudGet(st.acct.email).then(r=>{if(r&&S&&S.acct&&S.acct.email===r.acct.email&&(r.savedAt||0)>(S.savedAt||0)&&!sell){S=r;resume()}});
    return;
  }
  authMode=last?'login':'signup'; showLogin();
}
window.claude?.hot?.snapshot?.(()=>({S:S?(sell?{...S,phase:'market'}:S):null}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
